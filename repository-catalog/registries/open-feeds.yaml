# Open feeds registry: every free feed the open-feeds collector fetches (spec: docs/specs/open-feeds.md).
#
# One row per feed. Adding a feed = adding a row; the hourly run picks it up. Check offline:
#   .venv/bin/python infra/scripts/data_lake/open_feeds.py check
# and live before committing new rows:
#   .venv/bin/python infra/scripts/data_lake/open_feeds.py probe --only <id>[,<id>...]
#
# Fields
#   id           [a-z0-9-], unique; Bronze item ids are "<id>:<sha256(guid)[:16]>"
#   kind         rss (RSS/Atom/RDF) | json (keyless API) | html (page scrape; robots.txt is checked every run)
#   url          https only (redirects must stay https)
#   category     free-text topic; subcategory optional
#   every_hours  1 | 2 | 3 | 6 | 12 | 24 | 168 (default 1)
#   keep         headline (title, link, time, tags; default) | full (also the summary; only for open licences)
#   json         items: dot path to the list ("" = root), id: field(s), title, link | link_template, time, keep: [dot paths]
#                or snapshot: true (whole document, stored when its content changes), path, time
#   html         item: CSS selector, title / link: selectors inside the item, fields: {name: selector}
#   enabled      false keeps a row documented but not fetched; say why in `note`
#   max_items    items kept per fetch (default 300, up to 5000); the rest are counted as items_truncated
#   json.changes fields whose value is part of the item version (a revised value lands as a new row)
#   paths        dot paths; a key that contains dots: _meta["io.example/official"].publishedAt
#
# Rules (same guardrails as source-coverage.yaml): free, keyless, public data only; no login, paywall, CAPTCHA or
# rate-limit bypass; never turn TLS verification off; no author names or user content (personal data);
# publisher RSS keeps headline + link only. Sources with verdict skip / blocked-legal in source-coverage.yaml
# (Reddit, CoinGecko, Product Hunt, LinkedIn, ...) are not added here; the collector refuses an
# enabled row on those hosts (BLOCKED_HOSTS in open_feeds.py).
#
# Seed 2026-11-18: hand-picked feeds and APIs (Thai and world news, AI, arXiv, security, earth, economy,
# government, platform status, GitHub releases/trending) + the CC0 lists of github.com/plenaryapp/awesome-rss-feeds
# (recommended + countries, with_category). Every enabled row answered with items on the 2026-11-18 probe.
