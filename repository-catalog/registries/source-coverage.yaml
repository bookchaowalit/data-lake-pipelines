# Source coverage registry: how each SaaS / data source can reach the data platform, in priority order
#   1. official API  ->  2. MCP server  ->  3. scraping (last resort, only where ToS and robots.txt allow).
#
# One row per source, one batch of 20 per round, most popular / most relevant first. A round ends with
# every row of its batch filled in, a Thai report (docs/source-coverage/batch-NN.md) and the next batch listed.
# Check: python3 infra/scripts/utils/source_coverage_check.py   (offline; part of CI)
#
# Fields
#   method          the best allowed way in: api | mcp | scrape | manual-export | none
#   current_status  covered | partial | missing   (what the platform holds today, not what is possible)
#   coverage_pct    share of the useful entities the platform already holds (0-100)
#   flow            id in solo-empire repository-catalog/registries/data-sources.yaml, when one exists
#   scores          1 (low) .. 5 (high): value, cost, effort, risk
#   verdict         ingest-now | later | skip | blocked-legal | covered
#   owner_action    what only the owner can do, with the page URL and where the key goes (Infisical path)
#   evidence        official URLs read for this row (docs, terms, MCP page); "unverified" notes stay in tos_notes
#
# Guardrails: no plan purchases, no client or company accounts (NexaTech, Oak, Happy-Teeth), no auth,
# paywall or CAPTCHA bypass, no more personal data than needed (PDPA/GDPR). Unsure about legal = ask the owner.
# No secrets here: names, URLs and Infisical paths only.
