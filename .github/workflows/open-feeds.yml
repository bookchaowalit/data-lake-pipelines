# Open feeds: every free RSS/Atom feed, keyless JSON API and robots-allowed page in
# repository-catalog/registries/open-feeds.yaml → Bronze on the R2 lake (spec: docs/specs/open-feeds.md).
# Hourly; each feed is fetched only when its every_hours is due, and only unseen items are written.
#
# Public repository: GitHub-hosted runner ($0), and the log is public, so only counts, feed ids
# and object keys are printed. The dedupe state (ETag + hashes of the items in each feed) lives in
# the Actions cache, not in the write-once lake; a cache miss only re-sends current items
# (Silver keeps one row per id). Failures and missed runs reach Telegram through the uptime
# Worker heartbeat `open-feeds`.
name: Open feeds (Bronze)

on:
  # Scheduled by the jobs queue (platform-jobs-worker job `open-feeds`, cron "25 * * * *" UTC), ADR-0008.
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch every enabled feed, due or not"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: open-feeds
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      exit_code: ${{ steps.capture.outputs.exit_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install runtime from uv.lock
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.1
          uv sync --frozen --no-dev

      - name: Restore feed state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .open-feeds
          key: open-feeds-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: open-feeds-state-

      - name: Capture into Bronze
        id: capture
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.JOB_DATA_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.JOB_DATA_R2_SECRET_ACCESS_KEY }}
          DATA_LAKE_S3_ENDPOINT: ${{ secrets.JOB_DATA_S3_ENDPOINT }}
          AWS_ENDPOINT_URL: ${{ secrets.JOB_DATA_S3_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
          DATA_LAKE_CLOUD_WRITE_ENABLED: "true"
          SOLO_EMPIRE_DATA_LAKE_URI: ${{ secrets.JOB_DATA_LAKE_URI }}
          OPEN_FEEDS_STATE: ${{ github.workspace }}/.open-feeds/state.json.gz
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          set +e
          .venv/bin/python infra/scripts/data_lake/open_feeds.py run --require-cloud $FORCE > "$RUNNER_TEMP/result.json" 2> "$RUNNER_TEMP/stderr.log"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Status, counts, failing feed ids and manifest keys only (public log).
          jq '{status, error, detail, fetched_at, state_loaded, feeds_registered, feeds_enabled, feeds_due, feeds_deferred, ok, not_modified, errors, robots_denied, feeds_failing, items_new, items_skipped, items_truncated, failed_feeds, manifests}' "$RUNNER_TEMP/result.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Save feed state
        # Also after a partial failure (exit 3): the feeds that answered must not be re-sent next hour.
        if: ${{ always() && hashFiles('.open-feeds/state.json.gz') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .open-feeds
          key: open-feeds-state-${{ github.run_id }}-${{ github.run_attempt }}

  heartbeat:
    needs: capture
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Heartbeat
        env:
          HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
          CODE: ${{ needs.capture.outputs.exit_code }}
        run: |
          if [ "$CODE" = "0" ]; then
            body='{"ok":true,"failed":[]}'
          else
            body='{"ok":false,"failed":["open-feeds"]}'
          fi
          curl -fsS -X POST https://monitor.bookchaowalit.com/heartbeat/open-feeds \
            -H "Authorization: Bearer $HEARTBEAT_TOKEN" -H "Content-Type: application/json" -d "$body"
