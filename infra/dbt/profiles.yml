# Colocated with the project (not ~/.dbt/profiles.yml) so CI and any
# checkout can run `dbt run --profiles-dir infra/dbt` without per-machine
# setup. DuckDB file is local scratch state (gitignored), rebuilt from
# Bronze Parquet on every run — never itself a source of truth.
solo_empire_lake:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Directly in the project dir (not target/<file>): dbt-duckdb does
      # not create missing parent directories before opening the database
      # file, and the project directory itself always exists. Confirmed
      # by a real CI failure when this pointed at target/local.duckdb.
      # DBT_DUCKDB_PATH lets a runner build into its own scratch file.
      path: "{{ env_var('DBT_DUCKDB_PATH', 'local.duckdb') }}"
      threads: 4
      # Offset-less timestamps in the lake are UTC; never read them in the
      # machine's local zone.
      settings:
        TimeZone: UTC
