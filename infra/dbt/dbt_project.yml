name: solo_empire_lake
version: "1.0.0"
config-version: 2

profile: solo_empire_lake

model-paths: ["models"]
clean-targets: ["target", "dbt_packages"]

vars:
  # The lake URI may be a local path or a file:// URI. Both roots are
  # overridable so CI or another checkout layout can point elsewhere without
  # editing SQL.
  bronze_root: "{{ env_var('SOLO_EMPIRE_DATA_LAKE_URI', '../../data/lake') }}/bronze"
  bronze_manifest_root: "{{ env_var('SOLO_EMPIRE_DATA_LAKE_URI', '../../data/lake') }}/control/manifests"
  # Exactly one jobs Silver part; required for the jobs models (see
  # stg_job_postings). The jobs_marts runner sets it.
  jobs_silver_part: ""
  # Sales marts (docs/specs/sales-marts.md).
  sales_timezone: "Asia/Bangkok"
  sales_late_after_hours: 24
  # Running net revenue (minor units) at or above which a customer is VIP, per currency.
  # A currency missing here never makes a customer VIP.
  sales_vip_threshold_minor:
    THB: 10000000
    USD: 300000

models:
  solo_empire_lake:
    staging:
      +materialized: view
    marts:
      +materialized: table
    metadata:
      +materialized: table
