name: solo_empire_lake
version: "1.0.0"
config-version: 2

profile: solo_empire_lake

model-paths: ["models"]
clean-targets: ["target", "dbt_packages"]

vars:
  # The lake URI may be a local path or a file:// URI. Both roots are
  # overridable so CI or another checkout layout can point elsewhere without
  # editing SQL.
  bronze_root: "{{ env_var('SOLO_EMPIRE_DATA_LAKE_URI', '../../data/lake') }}/bronze"
  bronze_manifest_root: "{{ env_var('SOLO_EMPIRE_DATA_LAKE_URI', '../../data/lake') }}/control/manifests"
  # The jobs_marts runner overrides this with the exact Silver part it built;
  # the glob is for local development only (see stg_job_postings).
  jobs_silver_part: "{{ env_var('SOLO_EMPIRE_DATA_LAKE_URI', '../../data/lake') }}/silver/domain=jobs/dataset=job_postings/schema_version=1/event_date=*/part-*.parquet"

models:
  solo_empire_lake:
    staging:
      +materialized: view
    marts:
      +materialized: table
    metadata:
      +materialized: table
