name: solo_empire_lake
version: "1.0.0"
config-version: 2

profile: solo_empire_lake

model-paths: ["models"]
clean-targets: ["target", "dbt_packages"]

vars:
  # The lake URI may be a local path or a file:// URI. Both roots are
  # overridable so CI or another checkout layout can point elsewhere without
  # editing SQL.
  bronze_root: "{{ env_var('SOLO_EMPIRE_DATA_LAKE_URI', '../../data/lake') }}/bronze"
  bronze_manifest_root: "{{ env_var('SOLO_EMPIRE_DATA_LAKE_URI', '../../data/lake') }}/control/manifests"

models:
  solo_empire_lake:
    staging:
      +materialized: view
    marts:
      +materialized: table
    metadata:
      +materialized: table
