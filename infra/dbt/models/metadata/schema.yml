version: 2

models:
  - name: stg_meta_data_sources
    description: >
      Inbound data flows from solo-empire repository-catalog/registries/data-sources.yaml,
      latest export by data_lake/registry_lake_export.py. Structure only; notes stay in Git.
    columns:
      - name: source_id
        tests: [unique, not_null]
      - name: automation
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["automated", "manual", "not-captured"]
  - name: stg_meta_systems
    description: Systems from solo-empire online-systems.yaml (latest export).
    columns:
      - name: system_id
        tests: [unique, not_null]
  - name: stg_meta_catalog_assets
    description: Assets from architecture-docs systems/ai-data/metadata-catalog/catalog.yaml.
    columns:
      - name: asset_id
        tests: [unique, not_null]
  - name: stg_meta_lineage_edges
    description: Edges from architecture-docs systems/ai-data/metadata-catalog/lineage.yaml.
    columns:
      - name: edge_id
        tests: [unique, not_null]
      - name: from_asset
        tests:
          - relationships:
              arguments:
                to: ref('stg_meta_catalog_assets')
                field: asset_id
      - name: to_asset
        tests:
          - relationships:
              arguments:
                to: ref('stg_meta_catalog_assets')
                field: asset_id
  - name: meta_lake_datasets
    description: Bronze datasets per source with committed manifests (what the lake holds).
  - name: meta_source_lineage
    description: Catalog assets reachable from each inbound flow (depth 0 = the flow's own assets).
    columns:
      - name: source_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_meta_data_sources')
                field: source_id
  - name: meta_source_coverage
    description: >
      One row per inbound flow with capture status, hosting and downstream reach;
      answers which sources are still outside the platform.
    columns:
      - name: source_id
        tests: [unique, not_null]
  - name: stg_meta_capability_domains
    description: The 15 EOS capability domains from solo-empire business-capabilities.yaml.
    columns:
      - name: domain_id
        tests: [unique, not_null]
      - name: domain_number
        tests: [unique, not_null]
  - name: stg_meta_system_capabilities
    description: >
      System to EOS capability domain mapping from business-capabilities.yaml;
      domain_rank 1 (is_primary) is the system's primary domain.
    columns:
      - name: system_capability_id
        tests: [unique, not_null]
      - name: system_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_meta_systems')
                field: system_id
      - name: domain_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_meta_capability_domains')
                field: domain_id
  - name: meta_system_landscape
    description: >
      Generated system landscape: one row per system with hosting, EOS capability
      domains (primary first), inbound flows, reachable catalog assets and consumers.
    columns:
      - name: system_id
        tests: [unique, not_null]
      - name: capability_mapped
        description: false when a system has no business capability (the registry gate should prevent it).
        tests:
          - accepted_values:
              arguments:
                values: [true]
  - name: meta_capability_coverage
    description: >
      One row per EOS capability domain with serving systems, running systems,
      automated flows, consumers and a mechanical platform_coverage label.
    columns:
      - name: domain_id
        tests: [unique, not_null]
      - name: platform_coverage
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["missing", "partial", "served"]
