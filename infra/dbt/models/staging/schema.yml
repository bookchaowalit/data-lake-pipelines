version: 2

models:
  - name: stg_emails
    description: >
      One row per deduplicated Bronze event_id from
      domain=communications/dataset=emails. privacy_class=private; this
      model is for local/offline use only, never published.
    columns:
      - name: event_id
        description: Bronze envelope event identifier (stable per ingest run).
        tests:
          - unique
          - not_null
      - name: received_at
        tests:
          - not_null
      - name: event_time
        tests:
          - not_null
      - name: source_system
        tests:
          - not_null
      - name: domain
        tests:
          - accepted_values:
              arguments:
                values: ["communications"]
      - name: dataset
        tests:
          - accepted_values:
              arguments:
                values: ["emails"]
      - name: schema_version
        tests:
          - accepted_values:
              arguments:
                values: ["1"]
      - name: privacy_class
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["private", "internal", "public", "restricted"]
      - name: retention_class
        tests:
          - not_null
      - name: message_id
        tests:
          - not_null
      - name: label_count
        tests:
          - not_null
  - name: stg_x_feed
    description: >
      One row per deduplicated X post sighting (pull, post, query, chief) from
      domain=social/dataset=x_feed, exported from the intake cell. post_text is
      untrusted user content. privacy_class=private; local/offline use only.
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: sighting_key
        tests:
          - unique
          - not_null
      - name: post_id
        tests:
          - not_null
      - name: requesting_chief
        tests:
          - not_null
      - name: collected_at
        tests:
          - not_null
      - name: domain
        tests:
          - accepted_values:
              arguments:
                values: ["social"]
      - name: dataset
        tests:
          - accepted_values:
              arguments:
                values: ["x_feed"]
      - name: privacy_class
        tests:
          - accepted_values:
              arguments:
                values: ["private"]
