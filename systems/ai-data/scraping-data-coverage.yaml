schema_version: solo-empire.scraping-data-coverage.v1
kind: scraping-data-requirements
updated: 2026-10-23
owner: data-product-owner

scope:
  objective: Evidence-backed public-source collection for portfolio decisions and governed data products.
  boundary: Public APIs, RSS, CLI/export, and bounded website acquisition only; private operational integrations are excluded.
  acquisition_order: [api, cli, rss, scrape]
  percentage_rule: End-to-end coverage requires ready collection, documented permission, an active schedule when declared, fresh capture, fresh lake evidence, and a versioned consumer contract.

source_registry:
  path: systems/ai-data/scraping-source-registry.snapshot.yaml
  runtime_path: projects/product/engineering/book-dev/github/bookchaowalit/public/book-apps/tools/career-job-scraper/config/source_coverage.yaml

excluded_ingress:
  - id: gmail
    access: Official Gmail API with user OAuth and lake-first ingest
    reason: Private communications must never be collected by public web scraping.
  - id: calendar
    access: Official Google Calendar API or owner export
    reason: Calendar data is private operational data with an explicit account boundary.
  - id: tasks
    access: Official Todoist, Jira, or Notion API/CLI
    reason: Mutable task state requires identity, audit, and conflict handling.
  - id: finance-private
    access: Owner-provided files or approved provider APIs followed by human review
    reason: Transactions and account evidence are private and must not be inferred from public pages.
  - id: analytics
    access: Search Console, GA4, Ahrefs, or first-party analytics exports/APIs
    reason: Owned performance data requires authenticated provider access.
  - id: customer-research
    access: Permission-first interviews, referrals, and approved research notes
    reason: Contact and interview evidence must not be harvested from personal profiles.

products:
  - id: jobs
    name: Jobs and freelance discovery
    domain: jobs
    priority: P0
    required: true
    decision: Prioritize current roles and projects that match skills, location, timezone, and evidence.
    owner: book-job-data
    consumers: [job-client, opportunity-backlog, dashboard-leads, book-sales-jobsdb]
    grain: One canonical job posting or derived match per source record.
    retention: operational-plus-history
    permission:
      status: bounded
      classification: public_source_with_terms
      basis: Public job APIs and bounded public-board reads with attribution and rate limits.
    cron_tags: [book-scraping-scheduler]
    sources:
      - job: job_postings
        quality_status: verified
        capture:
          paths:
            - projects/product/engineering/book-dev/github/bookchaowalit/public/book-apps/tools/career-job-scraper/data/job_postings.csv
          max_age_hours: 8
      - job: career_postings
        quality_status: verified
        capture:
          paths:
            - projects/product/engineering/book-dev/github/bookchaowalit/public/book-apps/tools/career-job-scraper/data/career_postings.csv
          max_age_hours: 8
      - job: job_match_filter
        quality_status: verified
        capture:
          paths:
            - projects/product/engineering/book-dev/github/bookchaowalit/public/book-apps/tools/career-job-scraper/data/matched_jobs.csv
          max_age_hours: 30
    lake:
      required: true
      datasets:
        - id: job_postings
          paths:
            - data/lake*/**/bronze/domain=jobs/dataset=job_postings/schema_version=*/ingest_date=*/source=book-job-data/*.parquet
          max_age_hours: 8
        - id: job_matches
          paths:
            - data/lake*/**/bronze/domain=jobs/dataset=job_matches/schema_version=*/ingest_date=*/source=book-job-data/*.parquet
          max_age_hours: 30
    delivery:
      kind: api_and_duckdb
      contract_path: systems/architecture/job-data-contract-v1.yaml
      schema_version: job.v1
      api_port: 8109
      api_mode: on_demand
    next_action: Keep the parent run_jobs_capture.py slice bounded to the four free APIs; install the operator-gated book-scraping-scheduler only after provider controls are approved, then use --require-job-readiness before starting consumers and block on reconciliation or freshness alerts.

